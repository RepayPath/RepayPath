workflows:
  compile-check:
    name: Compile Check (no signing)
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Compile
        script: |
          xcodebuild \
            -project "RepayPath.xcodeproj" \
            -scheme "RepayPath" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/Build/Products/Release-iphoneos/*.app

  ios-build:
    name: RepayPath iOS Build (signed)
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - appstore_creds
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fumikothelen.repaypath
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.fumikothelen.repaypath" \
            --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number
        script: |
          # 用 Codemagic 的构建计数器作为 CFBundleVersion，避免重复上传被拒
          agvtool new-version -all $BUILD_NUMBER
          echo "CFBundleVersion set to $BUILD_NUMBER"
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "RepayPath.xcodeproj" \
            --scheme "RepayPath"
      - name: Upload to App Store Connect
        script: |
          set -e
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" | tr -d '\r' \
            > "$HOME/private_keys/AuthKey_RLG6ABG37X.p8"
          chmod 600 "$HOME/private_keys/AuthKey_RLG6ABG37X.p8"
          head -1 "$HOME/private_keys/AuthKey_RLG6ABG37X.p8"
          wc -c "$HOME/private_keys/AuthKey_RLG6ABG37X.p8"

          for ipa in build/ios/ipa/*.ipa; do
            echo "Uploading $ipa"
            xcrun altool --upload-app -f "$ipa" -t ios \
              --apiKey "RLG6ABG37X" \
              --apiIssuer "dd7fd4ee-3919-4f40-b1d6-3af6db6f821f" \
              --verbose
          done
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  preview:
    name: Demo Video + Screenshots (no signing)
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Build for simulator
        script: |
          xcodebuild \
            -project "RepayPath.xcodeproj" \
            -scheme "RepayPath" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Record one continuous demo (home screen -> all tabs)
        script: |
          set -e
          BUNDLE="com.fumikothelen.repaypath"
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          mkdir -p capture
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone 17 Pro Max (" | grep -oE "[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}")
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -m1 "iPhone 16 Pro Max (" | grep -oE "[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}")
          fi
          echo "DEVICE=$UDID"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"

          # 回到主屏，让录像从桌面开始
          xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
          echo "$UDID" > capture/udid.txt
          sleep 5

          # 开始录制（把 recordVideo 的输出留在日志里，失败时能看到原因）
          xcrun simctl io "$UDID" recordVideo --codec h264 --force "capture/demo.mp4" > capture/record.log 2>&1 &
          RECPID=$!
          sleep 3

          # 启动 App，RP_TAB=auto 让它每 4 秒自动切页
          SIMCTL_CHILD_RP_TAB=auto xcrun simctl launch "$UDID" "$BUNDLE"
          sleep 20

          # 停止录制（必须 SIGINT 才会写完整文件）
          kill -INT $RECPID 2>/dev/null || true
          sleep 4
          echo "--- recordVideo log ---"
          cat capture/record.log 2>/dev/null || true
          ls -la capture

          if [ ! -s "capture/demo.mp4" ]; then
            echo "!! 第一次录制没有产出文件，换写法重试"
            xcrun simctl io "$UDID" recordVideo --codec=h264 --force "capture/demo.mp4" > capture/record2.log 2>&1 &
            RECPID2=$!
            sleep 2
            SIMCTL_CHILD_RP_TAB=auto xcrun simctl launch "$UDID" "$BUNDLE"
            sleep 18
            kill -INT $RECPID2 2>/dev/null || true
            sleep 4
            echo "--- retry log ---"
            cat capture/record2.log 2>/dev/null || true
            ls -la capture
          fi
      - name: Screenshots per tab
        script: |
          set -e
          BUNDLE="com.fumikothelen.repaypath"
          UDID_FILE=$(cat capture/udid.txt)
          echo "booted=$UDID_FILE"
          for i in 0 1 2 3; do
            xcrun simctl terminate "$UDID_FILE" "$BUNDLE" 2>/dev/null || true
            SIMCTL_CHILD_RP_TAB=$i xcrun simctl launch "$UDID_FILE" "$BUNDLE"
            sleep 3
            xcrun simctl io "$UDID_FILE" screenshot "capture/screen$i.png"
            echo "shot tab$i"
          done
          ls -la capture
    artifacts:
      - capture/*.mp4
      - capture/*.png
