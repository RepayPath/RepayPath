workflows:
  compile-check:
    name: Compile Check (no signing)
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Compile
        script: |
          xcodebuild \
            -project "RepayPath.xcodeproj" \
            -scheme "RepayPath" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/Build/Products/Release-iphoneos/*.app

  ios-build:
    name: RepayPath iOS Build (signed)
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - appstore_creds
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fumikothelen.repaypath
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.fumikothelen.repaypath" \
            --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "RepayPath.xcodeproj" \
            --scheme "RepayPath"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_identifier: RLG6ABG37X
        issuer_identifier: dd7fd4ee-3919-4f40-b1d6-3af6db6f821f
        submit_to_testflight: true
