workflows:
  compile-check:
    name: Compile Check (no signing)
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Compile
        script: |
          xcodebuild \
            -project "RepayPath.xcodeproj" \
            -scheme "RepayPath" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/Build/Products/Release-iphoneos/*.app

  ios-build:
    name: RepayPath iOS Build (signed)
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - appstore_creds
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fumikothelen.repaypath
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.fumikothelen.repaypath" \
            --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "RepayPath.xcodeproj" \
            --scheme "RepayPath"
      - name: Upload to App Store Connect
        script: |
          set -e
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" | tr -d '\r' \
            > "$HOME/private_keys/AuthKey_RLG6ABG37X.p8"
          chmod 600 "$HOME/private_keys/AuthKey_RLG6ABG37X.p8"
          echo "key file:"; head -1 "$HOME/private_keys/AuthKey_RLG6ABG37X.p8"; wc -c "$HOME/private_keys/AuthKey_RLG6ABG37X.p8"

          for ipa in build/ios/ipa/*.ipa; do
            echo "Uploading $ipa"
            xcrun altool --upload-app -f "$ipa" -t ios \
              --apiKey "RLG6ABG37X" \
              --apiIssuer "dd7fd4ee-3919-4f40-b1d6-3af6db6f821f" \
              --verbose
          done
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
